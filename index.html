<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advent of Code 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .day-button {
            background: white;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .day-button:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            background: #f0f0f0;
        }

        .day-button:active:not(.disabled) {
            transform: translateY(0);
        }

        .day-button.disabled {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
            position: relative;
        }

        .day-button.disabled::after {
            content: '🔒';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.8em;
        }

        .day-button.disabled:hover {
            transform: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #e0e0e0;
        }

        .answer-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 200px;
            scroll-margin-top: 20px;
        }

        .answer-container h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .answer-content {
            font-size: 1.1em;
            line-height: 1.6;
            color: #333;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎄 Advent of Code 2025 🎄</h1>
        
        <div class="days-grid" id="daysGrid">
            <!-- Buttons will be generated dynamically -->
        </div>

        <div class="answer-container" id="answerContainer" style="display: none;">
            <h2 id="answerTitle"></h2>
            <div class="answer-content" id="answerContent"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
