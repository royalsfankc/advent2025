<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>⭐⭐ Advent of Code 2025</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .day-button {
            background: white;
            border: none;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .day-button:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            background: #f0f0f0;
        }

        .day-button:active:not(.disabled) {
            transform: translateY(0);
        }

        .day-button.disabled {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
            position: relative;
        }

        .day-button.disabled::after {
            content: '🔒';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.8em;
        }

        .day-button.disabled:hover {
            transform: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #e0e0e0;
        }

        .answer-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 200px;
            scroll-margin-top: 20px;
        }

        .answer-container h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .answer-content {
            font-size: 1.1em;
            line-height: 1.6;
            color: #333;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
        }

        .puzzle-info-section {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .puzzle-info-section h3 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .puzzle-description {
            font-size: 1.05em;
            margin-bottom: 15px;
            color: #555;
        }

        .part-explanation {
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }

        .approach-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .approach-section h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .answers-section {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .answers-section h3 {
            color: #4caf50;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .answer-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #2e7d32;
            font-family: 'Courier New', monospace;
        }

        .input-section {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .input-section h3 {
            color: #ff9800;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .input-snippet {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
        }

        .input-line {
            margin: 2px 0;
            word-break: break-all;
        }

        .toggle-input {
            margin-top: 10px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .toggle-input:hover {
            background: #f57c00;
        }

        .functions-section {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .functions-section h3 {
            color: #2196f3;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .functions-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .function-item {
            background: white;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #2196f3;
        }

        .function-name {
            background: #2196f3;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.95em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }

        .function-desc {
            margin: 0;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎄 Advent of Code 2025 🎄</h1>
        
        <div class="days-grid" id="daysGrid">
            <!-- Buttons will be generated dynamically -->
        </div>

        <div class="answer-container" id="answerContainer" style="display: none;">
            <h2 id="answerTitle"></h2>
            <div class="answer-content" id="answerContent"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
